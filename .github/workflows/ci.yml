name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Needed even for `npm ci`: the postinstall hook runs `prisma generate`,
      # and prisma.config.ts resolves DATABASE_URL eagerly.
      DATABASE_URL: postgresql://excel:excel@localhost:5432/excel_practice
      NEXT_PUBLIC_SITE_URL: https://excel-practice.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate:content
      - run: npm run lint
      - run: npx next typegen && npx tsc --noEmit
      - run: npm run build
